<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Atrium: open to the sky, open to everyone">
  <title>Atrium: open to the sky, open to everyone</title>
  <rect width="1200" height="630" fill="#F7F5F0"/>

  <!-- Mark: an open hall whose roof is the two lobes of a heart, open at the centre to let light in, with a pulse on the floor -->
  <g id="atrium-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- light falling through the open roof -->
    <path d="M292 270 L308 270 L362 438 L238 438 Z" fill="#B4372A" fill-opacity="0.08" stroke="none"/>
    <path d="M300 276 V430" stroke="#B4372A" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 7"/>
    <!-- walls and the two lobes, left open at the centre -->
    <path d="M178 452 V306 C178 226 246 198 290 262" stroke="#111110" stroke-width="7"/>
    <path d="M422 452 V306 C422 226 354 198 310 262" stroke="#111110" stroke-width="7"/>
    <!-- inner columns -->
    <path d="M214 452 V318" stroke="#111110" stroke-width="3" stroke-opacity="0.55"/>
    <path d="M386 452 V318" stroke="#111110" stroke-width="3" stroke-opacity="0.55"/>
    <!-- floor -->
    <path d="M150 452 H450" stroke="#111110" stroke-width="7"/>
    <!-- the pulse: a light-read heartbeat waveform -->
    <path d="M232 420 H258 C270 420 276 368 290 368 C304 368 306 404 314 402 C322 400 324 390 332 393 C341 397 344 420 356 420 H368" stroke="#B4372A" stroke-width="5"/>
  </g>

  <!-- Wordmark and story -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#111110">
    <text x="560" y="300" font-size="92" font-weight="700" letter-spacing="22">ATRIUM</text>
    <rect x="562" y="326" width="96" height="5" fill="#B4372A"/>
    <text x="560" y="386" font-size="30" font-weight="500">Open to the sky. Open to everyone.</text>
    <text x="560" y="446" font-size="20" fill="#55534E"><tspan font-weight="700" fill="#111110">Architecture</tspan>: an open hall, lit from the sky.</text>
    <text x="560" y="482" font-size="20" fill="#55534E"><tspan font-weight="700" fill="#111110">Body</tspan>: the chamber where every beat begins.</text>
    <text x="560" y="562" font-size="17" fill="#55534E" letter-spacing="1">Open-source wearable · Made in India</text>
  </g>
</svg>
