# Atrium charging case (EVT, Rev B 2026-11-10: BQ24040 charger with cell-temperature cut-off): single 2-layer board under the nest. Spec: docs/charging-case.md.
# Same schema as atrium_nets.yaml. LCSC numbers checked against EasyEDA's LCSC-linked library 2026-11-08.
# Pads without an LCSC number are copper pads (cell tabs, pogo landings, programming pads): placeholder pad on the
# schematic, off the BOM.
meta:
  board_names: {CASE: case}
  mcu_pinmap: firmware session 2026-11-08 (CH32V003F4U6 QFN-20, ch32fun)

components:
  U1:  {board: CASE, side: top, part: CH32V003F4U6 RISC-V MCU, pkg: QFN-20 3x3 0.4p, lcsc: C5299908}
  U2:  {board: CASE, side: top, part: BQ24040DSQR linear Li-ion charger with battery-temperature (TS) input, pkg: WSON-10 2x2 0.4p EP, lcsc: C81080,
        note: "Rev B (2026-11-10), replaces the TP4054 (no temperature input, low stock). R5 2.7k on ISET: 540 / 2700 = 200 mA (189-207 mA, K_ISET 510-560 AΩ, SLUS941H table 7.5). ISET2 to VSS: the ISET current. R24 2k on PRE-TERM: termination 10 %, pre-charge 20 %. TS: TH2 10k NTC on the board above the cell (3.0 mm from U2, see build item B-10), 50 uA internal bias; outside the JEITA window the charger halves the current (cold) or drops to 4.06 V (warm) and stops at the limits, with no MCU involved. Fixed 10 h safety timer, 6.6 V input OVP. CHG open drain to PD6 as before; PG and NC unconnected. Thermal pad to GND"}
  U3:  {board: CASE, side: top, part: TPS61023DRLR boost (same part as DRLT on a 3k reel; DRLT stock was 555), pkg: SOT-563, lcsc: C919459, note: "5.21 V: 0.6 V x (1 + 768k / 100k)"}
  U4:  {board: CASE, side: top, part: SY6280AAC current-limited switch, pkg: SOT-23-5, lcsc: C55136,
        note: "ISET 15k: 6800 / 15000 = 0.45 A (hardware backstop; firmware trips at 80 mA)"}
  U5:  {board: CASE, side: top, part: SN74LVC1T45DBVR (SWDCLK, A -> B), pkg: SOT-23-6, lcsc: C7843}
  U6:  {board: CASE, side: top, part: SN74LVC1T45DBVR (SWDIO, DIR from MCU), pkg: SOT-23-6, lcsc: C7843}
  U7:  {board: CASE, side: top, part: XC6206P182MR 1.8 V LDO (powered from PD5), pkg: SOT-23-3, lcsc: C21659}
  U8:  {board: CASE, side: top, part: HAL248 SW omnipolar hall (lid), pkg: DFN-6, lcsc: C6320892}
  J1:  {board: CASE, side: top, part: USB-C 16-pin receptacle, lcsc: C2765186}
  L1:  {board: CASE, side: top, part: 1 uH 4.2 A 54 mohm 2520, lcsc: C98348}
  D1:  {board: CASE, side: top, part: 1N5819WS SOD-323 Schottky (VBUS -> 5V_POD; replaces B5819WS C179554, out of stock), lcsc: C191023,
        note: "SOD-323, not SOD-123: two stacked SOD-123 bodies (1.6 mm) did not fit between SW1 and J1 (mech fit 2026-11-08) [VERIFY Pd at the 0.45 A ISET limit]"}
  D2:  {board: CASE, side: top, part: 1N5819WS SOD-323 Schottky (boost -> 5V_POD; replaces B5819WS C179554, out of stock), lcsc: C191023,
        note: "SOD-323, not SOD-123: two stacked SOD-123 bodies (1.6 mm) did not fit between SW1 and J1 (mech fit 2026-11-08) [VERIFY Pd at the 0.45 A ISET limit]"}
  D3:  {board: CASE, side: top, part: XL-1615RGBC-RF RGB LED, lcsc: C965840, note: "common anode to VDD [VERIFY pinout]"}
  SW1: {board: CASE, side: top, part: Alps SKSCLAE010 side-push tactile 3.5 x 2.9 x 1.25 (stem to the -Y wall), lcsc: C130445}
  TH1: {board: CASE, side: top, part: "NCU15WF104F6SRC 100k NTC, B 4250 K class (case cell, read by the MCU while feeding the pod; replaces the end-of-life NCP15WF104F03RC C77130) [VERIFY B against the firmware table]", lcsc: C458473}
  TH2: {board: CASE, side: top, part: "NCP15XH103F03RC 10k NTC B25/50 3380 K on the board above the case cell, for the charger TS input", lcsc: C77131}
  RS1: {board: CASE, side: top, part: 1 ohm 1 % 0603 shunt (low side, pod GND return), lcsc: C22936}
  R1:  {board: CASE, side: top, part: 5.1k CC1, lcsc: C25905}
  R2:  {board: CASE, side: top, part: 5.1k CC2, lcsc: C25905}
  R3:  {board: CASE, side: top, part: 10k VBUS_DET series, lcsc: C25744}
  R4:  {board: CASE, side: top, part: 100k VBUS_DET to GND, lcsc: C25741}
  R5:  {board: CASE, side: top, part: 2.7k BQ24040 ISET (200 mA), lcsc: C25885}
  R6:  {board: CASE, side: top, part: 768k boost FB top, lcsc: C27017}
  R7:  {board: CASE, side: top, part: 100k boost FB bottom, lcsc: C25741}
  R8:  {board: CASE, side: top, part: 1M BOOST_EN pull-down, lcsc: C26083}
  R9:  {board: CASE, side: top, part: 15k SY6280 ISET, lcsc: C25756}
  R10: {board: CASE, side: top, part: 1M VIN_EN pull-down, lcsc: C26083}
  R11: {board: CASE, side: top, part: 10k shunt to OPA_P, lcsc: C25744}
  R12: {board: CASE, side: top, part: 1.5M VDD to OPA_P (offset pedestal), lcsc: C22276}
  R13: {board: CASE, side: top, part: 1k OPA Rg, lcsc: C11702}
  R14: {board: CASE, side: top, part: 20k OPA Rf, lcsc: C25765}
  R15: {board: CASE, side: top, part: 100 ohm SWDCLK series, lcsc: C25076}
  R16: {board: CASE, side: top, part: 100 ohm SWDIO series, lcsc: C25076}
  R17: {board: CASE, side: top, part: 1M SWDIO_B pull-down (pod presence), lcsc: C26083}
  R18: {board: CASE, side: top, part: 1M LDO_PWR pull-down, lcsc: C26083}
  R19: {board: CASE, side: top, part: 330k LID pull-up (the HAL248 output is open drain, Hallwee data sheet V3.3 p4), lcsc: C25778}
  R20: {board: CASE, side: top, part: 100k NTC divider top (from PD0), lcsc: C25741}
  R21: {board: CASE, side: top, part: 1k LED red, lcsc: C11702}
  R22: {board: CASE, side: top, part: 330 ohm LED green, lcsc: C25104}
  R23: {board: CASE, side: top, part: 330 ohm LED blue, lcsc: C25104}
  R24: {board: CASE, side: top, part: 2k BQ24040 PRE-TERM (10 % termination, 20 % pre-charge), lcsc: C4109}
  C1:  {board: CASE, side: top, part: 10 uF 0603 VBUS, lcsc: C19702}
  C2:  {board: CASE, side: top, part: 4.7 uF 0603 charger OUT (BAT), lcsc: C19666}
  C3:  {board: CASE, side: top, part: 10 uF 0603 boost in, lcsc: C19702}
  C4:  {board: CASE, side: top, part: 22 uF 0805 boost out (CL21A226MAYNNNE), lcsc: C602037}
  C5:  {board: CASE, side: top, part: 10 uF 0603 5V_POD, lcsc: C19702}
  C6:  {board: CASE, side: top, part: 1 uF 0402 pogo VIN, lcsc: C52923}
  C7:  {board: CASE, side: top, part: 100 nF MCU VDD, lcsc: C1525}
  C8:  {board: CASE, side: top, part: 1 uF MCU VDD, lcsc: C52923}
  C9:  {board: CASE, side: top, part: 100 nF U5 VCCA, lcsc: C1525}
  C10: {board: CASE, side: top, part: 100 nF U5 VCCB, lcsc: C1525}
  C11: {board: CASE, side: top, part: 100 nF U6 VCCA, lcsc: C1525}
  C12: {board: CASE, side: top, part: 100 nF U6 VCCB, lcsc: C1525}
  C13: {board: CASE, side: top, part: 1 uF LDO in, lcsc: C52923}
  C14: {board: CASE, side: top, part: 1 uF LDO out, lcsc: C52923}
  C15: {board: CASE, side: top, part: 100 nF hall, lcsc: C1525}
  C16: {board: CASE, side: top, part: 100 pF OPA_P filter, lcsc: C14858}
  BT1: {board: CASE, side: bot, part: "cell + tab pad (Sharvi KP-502030)"}
  BT2: {board: CASE, side: bot, part: "cell - tab pad"}
  P1:  {board: CASE, side: top, part: "pogo VIN landing (pod VIN 10.45, 5.50)"}
  P2:  {board: CASE, side: top, part: "pogo GND landing (pod GND_B 12.65, 5.50)"}
  P3:  {board: CASE, side: top, part: "pogo SWDIO landing (pod 6.70, 3.30)"}
  P4:  {board: CASE, side: top, part: "pogo SWDCLK landing (pod 6.70, 7.70)"}
  TP1: {board: CASE, side: bot, part: "SWIO programming pad"}
  TP2: {board: CASE, side: bot, part: "VDD programming pad"}
  TP3: {board: CASE, side: bot, part: "GND programming pad"}

