name: atrium
description: "Atrium companion app"
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.3.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  crypto: ^3.0.6
  device_info_plus: ^13.3.0
  health: ^13.3.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mcumgr_flutter: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  hive_ce: ^2.23.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.1
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/models/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
