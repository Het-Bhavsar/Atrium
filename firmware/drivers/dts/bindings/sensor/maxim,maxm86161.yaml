description: |
  MAXM86161 optical module (AFE, green, IR and red LEDs, one photodiode),
  I2C address 0x62.

compatible: "maxim,maxm86161"

include: i2c-device.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: INTB, open drain, active low. Needs a pull-up.
  en-gpios:
    type: phandle-array
    required: true
    description: LDO_EN. High powers the module; low is 0.05 uA.
  sync-gpios:
    type: phandle-array
    description: GPIO pin, open drain. Optional frame sync; not used by the driver yet.
