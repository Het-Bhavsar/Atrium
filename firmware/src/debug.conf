# Bring-up build (tests/fw.sh debug): logs over SEGGER RTT on the SWD pads. With logs the
# image is 224 KB even without MCUmgr, more than a slot allows, so it runs without MCUboot
# from the start of flash (debug.overlay); flash it over SWD. prj.conf's MCUmgr transport
# choice then warns at configure time.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CBPRINTF_NANO=n
CONFIG_ATRIUM_LOG_LEVEL_INF=y
# no MCUboot in this image, so no firmware update over BLE
CONFIG_MCUMGR=n
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=n
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=n
# link inside debug_partition, so the image can never reach settings or the log
CONFIG_USE_DT_CODE_PARTITION=y
