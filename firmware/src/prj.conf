# Atrium pod application. Board-level settings are in boards/atrium/atrium_pod/.

# Kernel
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FPU=y
CONFIG_REBOOT=y

# Peripherals
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO_TRIGGER_GLOBAL_THREAD=y
CONFIG_FLASH=y
CONFIG_PM_DEVICE=y
# System OFF at the cut-off, woken by /PG
CONFIG_POWEROFF=y

# Storage, all internal flash: settings and bonds (8 KB), log (32 KB)
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Atrium"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_PRIVACY=y
# LE Secure Connections only (Zephyr's default, kept explicit): no legacy pairing, 16-byte keys.
# Just Works gives level 2; ble.c drops a link that is not SC, and one not encrypted in 30 s
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
# new pairings only in the window after a lift from the Plinth
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# a phone that lost its bond can pair again, also only in that window (2026-11-08):
# replacing a bond needs the pod in hand
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
# Fit the 220 KB slot: no robust GATT caching (Service Changed stays), no LE ping, the host
# resolves private addresses, no coded PHY (the nRF52832 has none)
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_CTLR_LE_PING=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_PHY_CODED=n

CONFIG_BT_DIS=y
CONFIG_BT_DIS_SETTINGS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Local Forge"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Atrium pod"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="EVT"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.0"
# Device Information and Zephyr's Battery service are open without encryption: no serial
# number (a fixed identifier), and no Battery service (SoC is in Charge State 0x0101)
CONFIG_BT_DIS_SERIAL_NUMBER=n
CONFIG_BT_BAS=n
CONFIG_BT_HRS=y
CONFIG_BT_HRS_DEFAULT_PERM_RW_ENCRYPT=y

# Firmware update: MCUmgr SMP over BLE into the MCUboot secondary slot
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# No logs in the release image: they cost 32 KB and the slot is 220 KB. For bring-up, the
# debug build (tests/fw.sh debug) adds debug.conf: logs over SEGGER RTT on the SWD pads.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_CBPRINTF_NANO=y
CONFIG_CBPRINTF_FP_SUPPORT=n
