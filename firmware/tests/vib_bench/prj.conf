# Vibration bench rig, nRF52 DK (docs/ble_gatt.md 4.5)
CONFIG_GPIO=y
CONFIG_SPI=y
# every transfer is 2 bytes or more, so nRF52832 anomaly 58 (one extra byte when RXD.MAXCNT is 1)
# cannot occur; Zephyr's NRF52_ANOMALY_58_WORKAROUND stays at its default (on) as well
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
# the serial port carries only the banner, the packet lines and the stats line
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=2048
